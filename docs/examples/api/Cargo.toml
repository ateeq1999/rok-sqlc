[package]
name = "rok-sqlc-api-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# An actix-web API started with `rok-sqlc init` and generated with
# `rok-sqlc g` from `migrations/` and `queries.sql`. See docs/guide/.

[dependencies]
# `init`'s hints at the end of `rok-sqlc.toml`, the generated
# `src/db/mod.rs`'s, and async-trait for the port in `tasks/service.rs`.
actix-web = "4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
validator = { version = "0.21", features = ["derive"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# A binary uses only part of the generated data layer and shared tools, and
# rustc would warn about the rest.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
