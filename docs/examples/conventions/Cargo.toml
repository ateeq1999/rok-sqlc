[package]
name = "rok-sqlc-conventions"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# The dependencies the generated `src/db/mod.rs` lists, plus tokio to run.
[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "rust_decimal"] }
uuid = "1"
chrono = "0.4"
rust_decimal = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
