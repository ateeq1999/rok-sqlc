# The actix template's configuration; this file is yours. `rok-sqlc g` reads
# it: `migrations/` and `queries/` become the data layer in `src/db/`, and
# `users` and `audit_log` API features in `src/features/`. See README.md.

schema = "migrations/"
output = "src/db"
# Hand-written SQL, one file per feature: `queries/auth.sql` becomes
# `db::queries::auth`, which only the `auth` feature (and `shared/`) calls.
queries = ["queries/"]
derive = ["serde", "validate"]
extractors = ["actix_web"]

[conventions]
primary_key_ids = "uuid_v7"
soft_delete_column = "deleted_at"
# Server-set columns: the database (defaults, `touch_updated_at`) or the
# account flows set them, so no create or update body takes them.
managed_columns = [
    "created_at",
    "updated_at",
    "password_hash",
    "email_verified",
    "totp_secret",
    "totp_enabled",
    "avatar_key",
    "failed_logins",
    "locked_until",
    "token_version",
]

[modules]
# `AuditLogEntry`, `AuditLogEntryResponse`, and its route stays `/audit-log`.
audit_log = "audit_log_entry"

[api]
output = "src/features"
prefix = "/api/v1"
# `media` and `api_keys` are hand-written features of a later release
# (uploads, API keys); `auth_tokens` and `outbound_mail` belong to the
# account flows and the mail outbox.
exclude = ["media", "api_keys", "auth_tokens", "outbound_mail"]

[api.access]
users = "admin"
audit_log = "admin"

[api.routes]
audit_log = "/audit-log"

[api.skip]
# Accounts are created by the sign-up and invitation flows, which hold the
# password; deleted accounts stay deleted.
users = ["create", "restore", "lookups", "relationships"]
# Read-only: the application writes it.
audit_log = ["create", "update", "remove", "relationships"]

[api.hidden]
users = [
    "password_hash",
    "totp_secret",
    "avatar_key",
    "failed_logins",
    "locked_until",
    "token_version",
    "updated_at",
    "deleted_at",
]

[api.immutable]
# An email changes only through the verification flow (a later release).
users = ["email"]

# String rules (VineJS names): an email is trimmed and lowercased before it
# is checked, once a body takes it (none does yet: no create, and the update
# leaves it immutable); a display name is trimmed.
[api.rules.users]
email = ["trim", "toLowerCase", "email"]
display_name = ["trim"]

[api.search]
users = ["email", "display_name"]

[api.sort]
users = ["created_at", "email"]
