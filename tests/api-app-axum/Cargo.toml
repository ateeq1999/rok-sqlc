[package]
name = "rok-sqlc-api-app-axum"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# An application built the way `rok-sqlc init --framework axum` lays one
# out: `tests/api-app` for axum (`[api] framework = "axum"`, 0.7 decision
# A7). `tests/fixture_compile/` in rok-sqlc scaffolds the skeleton with
# `init --framework axum` and generates `tests/api-app/migrations/` into
# `src/db/`, `src/shared/` and `src/features/`, then checks and tests this
# crate with `tests/api-app`'s suites (`tests/api-suite/`). Its `Cargo.lock`
# pins the versions every axum project `tests/fixture_compile/` builds
# resolves against.

[dependencies]
# What the axum skeleton and the generated API need (`init --framework
# axum`'s hints in `rok-sqlc.toml`, and the generated `src/db/mod.rs`'s).
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
ipnetwork = { version = "0.21", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
regex = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "json", "rust_decimal", "ipnetwork"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["chrono", "decimal", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v7", "serde"] }
validator = { version = "0.21", features = ["derive"] }

[dev-dependencies]
# Drives the router in the tests (`ServiceExt::oneshot`).
tower = { version = "0.5", features = ["util"] }
