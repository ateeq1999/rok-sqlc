[package]
name = "rok-sqlc-fixture-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "rust_decimal"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
# The fixture generates with `derive = ["serde"]` (ADR 0013).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[features]
# Compiles src/typed_id_mixup.rs, which must fail to compile (see
# tests/fixture_compile.rs in rok-sqlc).
typed-id-mixup = []
