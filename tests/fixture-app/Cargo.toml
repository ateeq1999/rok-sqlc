[package]
name = "rok-sqlc-fixture-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "derive", "uuid", "chrono", "rust_decimal"] }
uuid = "1"
chrono = "0.4"
rust_decimal = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
# Compiles src/typed_id_mixup.rs, which must fail to compile (see
# tests/fixture_compile.rs in rok-sqlc).
typed-id-mixup = []
