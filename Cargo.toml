[package]
name = "rok-sqlc"
version = "0.7.0"
edition = "2024"
description = "Generate SQLx Rust database modules from SQL schema files"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/ateeq1999/rok-sqlc"
readme = "README.md"
keywords = ["sqlx", "postgres", "codegen", "sql", "database"]
categories = ["database", "development-tools", "command-line-utilities"]
# Ship only what builds the library and binary. The integration tests need
# the module corpus and the fixture crates, which stay in the repository.
include = [
    "/src/**/*.rs",
    "/src/init/templates/*",
    # `init --template`: `build.rs` embeds `templates/`, but not a build of a
    # template made in place.
    "/build.rs",
    "/templates/**",
    "!/templates/*/target/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "rok_sqlc"
path = "src/lib.rs"

[[bin]]
name = "rok-sqlc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.59", features = ["visitor"] }
syn = { version = "2", features = ["full", "visit"] }
regex-syntax = "0.8"
toml = "1"

[dev-dependencies]
tempfile = "3"

# Release binaries (GitHub releases and `cargo install`) ship without debug
# symbols; they are several megabytes of the binary's size.
[profile.release]
strip = true
