[package]
name = "rok-sqlc"
version = "0.1.0"
edition = "2024"
description = "Generate SQLx Rust database modules from SQL schema files"
license = "MIT OR Apache-2.0"

[lib]
name = "rok_sqlc"
path = "src/lib.rs"

[[bin]]
name = "rok-sqlc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
heck = "0.5"
sqlparser = { version = "0.59", features = ["visitor"] }

[dev-dependencies]
tempfile = "3"
