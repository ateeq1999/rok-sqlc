name: Release

# Builds the rok-sqlc binary for every supported platform and publishes the
# archives, with SHA-256 checksums, as a GitHub release. The install scripts
# (install.sh, install.ps1) download from these releases.
#
# Pushing a tag `vX.Y.Z` releases that version: the tag must match `version`
# in Cargo.toml, and the release notes are CHANGELOG.md's `## [X.Y.Z]`
# section. To build an existing tag again (for example one tagged before
# this workflow existed), run the workflow by hand with that tag; it updates
# the release's assets instead of failing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.3.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Fails fast, before any build, when the tag and Cargo.toml disagree or
  # CHANGELOG.md has no section for the version.
  prepare:
    name: Check tag and extract release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          version="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $manifest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds link musl statically, so one binary runs on any
          # distribution regardless of its glibc version.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="rok-sqlc-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rok-sqlc" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rok-sqlc-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rok-sqlc.exe" "dist/$name/"
          Copy-Item README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          # Same format as shasum: "<hash>  <file>", LF line ending.
          [IO.File]::WriteAllText("dist/$name.zip.sha256", "$hash  $name.zip`n")
      - name: Smoke test the native binary
        # The x86_64 macOS binary runs under Rosetta on the arm64 runner;
        # aarch64 Windows cannot run on the x86_64 runner.
        if: matrix.target != 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/rok-sqlc"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir dist
          find artifacts -path '*/dist-*/*' -type f -exec cp {} dist/ \;
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          ls -l dist
      - name: Create or update the release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* \
              --title "rok-sqlc ${{ needs.prepare.outputs.version }}" \
              --notes-file artifacts/release-notes/release-notes.md \
              --verify-tag $prerelease
          fi

  # Installs the published release with the install scripts on each OS, the
  # way a user would, and runs the installed binary.
  verify-install:
    name: Verify install (${{ matrix.os }})
    needs: [prepare, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          ROK_SQLC_VERSION: ${{ env.TAG }}
          ROK_SQLC_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install.sh
          "$ROK_SQLC_INSTALL_DIR/rok-sqlc" --version | grep -F "${{ needs.prepare.outputs.version }}"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ROK_SQLC_VERSION: ${{ env.TAG }}
          ROK_SQLC_INSTALL_DIR: ${{ runner.temp }}\bin
          ROK_SQLC_NO_MODIFY_PATH: "1"
        run: |
          ./install.ps1
          $out = & "$env:ROK_SQLC_INSTALL_DIR\rok-sqlc.exe" --version
          Write-Output $out
          if ($out -notlike "*${{ needs.prepare.outputs.version }}*") { exit 1 }
